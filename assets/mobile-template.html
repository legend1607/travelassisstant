<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>__TITLE__</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<!--
  移动端独立行程模板 v1.0
  - API 密钥内嵌，不依赖外部 env.js
  - 单文件可在手机浏览器直接打开
  - 使用 __PLACEHOLDER__ 占位符（非 f-string），便于 Python 脚本替换
  - 父级可点击卡片内的链接必须添加 event.stopPropagation()
-->
<script>
window._AMapSecurityConfig = { securityJsCode: '__SECURITY_CODE__' };
window.AMAP_JSAPI_KEY = '__JSAPI_KEY__';
window.AMAP_REST_KEY = '__REST_KEY__';
</script>
<script src="https://webapi.amap.com/loader.js"></script>
<style>
:root{--bg-primary:#fff;--bg-secondary:#f5f5f7;--bg-grouped:#f2f2f7;--text-primary:#1d1d1f;--text-secondary:#86868b;--text-tertiary:#aeaeb2;--accent:#0071e3;--tint-red:#ff3b30;--tint-orange:#ff9500;--tint-green:#34c759;--tint-blue:#007aff;--tint-purple:#af52de;--separator:rgba(60,60,67,.12);--shadow-lg:0 8px 30px rgba(0,0,0,.12);--radius-xl:20px;--radius-md:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg-secondary);color:var(--text-primary);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#map{flex:1;min-height:0;position:relative;z-index:1}
#map-container{width:100%;height:100%}
#status-bar{position:absolute;top:0;left:0;right:0;z-index:100;padding:8px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:.5px solid var(--separator);display:flex;align-items:center;justify-content:space-between}
#status-bar .trip-title{font-weight:600;font-size:14px}
#day-tabs{display:flex;gap:6px;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none}
#day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;background:var(--bg-grouped);color:var(--text-secondary);white-space:nowrap;transition:all .2s}
.day-tab.active{background:var(--accent);color:#fff}
#sheet{background:var(--bg-primary);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-lg);max-height:50vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:50;transition:max-height .3s}
#sheet.expanded{max-height:78vh}
#sheet-handle{width:36px;height:5px;border-radius:100px;background:#aeaeb2;margin:8px auto 0;cursor:pointer;opacity:.6}
#content{padding:0 16px 16px}
.loc-card{display:flex;gap:10px;padding:10px 0;border-bottom:.5px solid var(--separator);cursor:pointer}
.loc-card:last-child{border-bottom:none}
.loc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.loc-info{flex:1;min-width:0}
.loc-name{font-size:14px;font-weight:500}
.loc-meta{font-size:11px;color:var(--text-secondary);margin-top:1px}
.loc-desc{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.4}
.loc-drive{font-size:11px;color:var(--tint-blue);margin-top:3px;background:rgba(0,122,255,.06);padding:2px 6px;border-radius:4px;display:inline-block}
.loc-hsr{font-size:11px;color:var(--tint-green);margin-top:3px;background:rgba(52,199,89,.06);padding:2px 6px;border-radius:4px;display:inline-block}
.xhs-ref{font-size:10px;color:var(--tint-red);margin-top:3px;background:rgba(255,59,48,.06);padding:2px 6px;border-radius:4px;display:inline-block}
.badge{font-size:10px;padding:1px 5px;border-radius:100px;font-weight:500;display:inline-block}
.badge.warn{background:rgba(255,149,0,.12);color:var(--tint-orange)}
.badge.danger{background:rgba(255,59,48,.12);color:var(--tint-red)}
.badge.info{background:rgba(0,122,255,.12);color:var(--tint-blue)}
.badge.ok{background:rgba(52,199,89,.12);color:var(--tint-green)}
.sec-head{font-size:12px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.ov-title{font-size:18px;font-weight:700;margin-bottom:6px}
.ov-text{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--bg-grouped);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-link{display:inline-block;padding:6px 14px;border-radius:100px;background:var(--accent);color:#fff;font-size:12px;font-weight:500;text-decoration:none;margin:4px 2px}
.nav-link.back{background:var(--bg-grouped);color:var(--text-primary)}
</style>
</head>
<body>
<div id="app">
<div id="map">
<div id="status-bar">
  <span class="trip-title">__STATUS_TITLE__</span>
  <a href="overview.html" class="nav-link back" style="font-size:11px;padding:3px 10px">← 总对比</a>
</div>
<div id="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--text-secondary)">加载地图中...</div></div>
<div id="map-container"></div>
</div>
<div id="sheet">
<div id="sheet-handle"></div>
<div id="day-tabs"></div>
<div id="content"></div>
</div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════
//  DATA — 由生成脚本替换
// ═══════════════════════════════════════════════════════════════
const PLAN = __PLAN_JSON__;
const ALL_NAMES = __NAMES_JSON__;

const EMOJIS={food:'🍽️',spot:'📍',hotel:'🏨',transport:'🚃',drive:'🚗',hsr:'🚄',taxi:'🚕',charter:'🚐',walk:'🚶'};
const COLORS={food:'#ff3b30',spot:'#007aff',hotel:'#ff9500',transport:'#34c759',drive:'#86868b',hsr:'#34c759',taxi:'#ff9500',charter:'#007aff',walk:'#86868b'};
const parseT=(t)=>{let m=t.match(/(\d+)h(\d+)m/);if(m)return parseInt(m[1])*60+parseInt(m[2]);m=t.match(/(\d+)h/);if(m)return parseInt(m[1])*60;m=t.match(/(\d+)m/);if(m)return parseInt(m[1]);return 0;};

let map=null,AMap=null,markers=[],polylines=[],currentDay=0;

function initMap(center,zoom){
  AMapLoader.load({key:window.AMAP_JSAPI_KEY,version:'2.0',plugins:['AMap.Scale','AMap.ToolBar']}).then(amap=>{
    AMap=amap;
    map=new AMap.Map('map-container',{viewMode:'3D',zoom:zoom||7,center:center||[127.0,42.2],pitch:25,mapStyle:'amap://styles/normal'});
    map.addControl(new AMap.Scale());
    map.on('complete',()=>{document.getElementById('loading').style.display='none';});
    renderUI(); showDay(0);
  }).catch(e=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('map-container').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;padding:20px;text-align:center;"><div style="font-size:40px;margin-bottom:8px;">🍁</div><div style="font-size:14px;font-weight:600;">行程详情</div><div style="font-size:12px;color:#86868b;">地图需联网加载</div></div>';
    document.getElementById('sheet').style.maxHeight='82vh';
    renderUI(); showDay(0);
  });
}

function clearMap(){if(!map)return;markers.forEach(m=>map.remove(m));polylines.forEach(p=>map.remove(p));markers=[];polylines=[];}

function addMarker(loc,color){
  if(!map||!AMap||!loc.lng)return;
  const m=new AMap.Marker({position:[loc.lng,loc.lat],title:loc.name,label:{content:`<div style="padding:2px 6px;background:${color};color:#fff;border-radius:6px;font-size:11px;white-space:nowrap;">${EMOJIS[loc.type]||'📌'} ${loc.name}</div>`,direction:'top',offset:new AMap.Pixel(0,-4)}});
  m.on('click',()=>{new AMap.InfoWindow({content:buildIW(loc),offset:new AMap.Pixel(0,-30)}).open(map,[loc.lng,loc.lat]);});
  map.add(m);markers.push(m);
}

function addPolyline(coords,color,style){
  if(!map||!AMap||coords.length<2)return;
  const p=new AMap.Polyline({path:coords,strokeColor:color,strokeWeight:3,strokeOpacity:.7,strokeStyle:style||'dashed',strokeDasharray:style==='solid'?undefined:[6,5]});
  map.add(p);polylines.push(p);
}

function buildIW(loc){
  let h='<div style="padding:8px 12px;min-width:200px;"><b style="font-size:13px;">'+loc.name+'</b>';
  if(loc.time&&loc.time!=='—')h+='<br><span style="color:#86868b;font-size:11px;">⏰ '+loc.time+'</span>';
  if(loc.desc)h+='<br><span style="font-size:12px;">'+loc.desc+'</span>';
  if(loc.budget)h+='<br><span style="color:#ff9500;font-size:11px;">💰 '+loc.budget+'</span>';
  if(loc.reserve)h+='<br><span style="color:#ff3b30;font-size:11px;">📅 '+loc.reserve+'</span>';
  if(loc.xhs)h+='<br><span style="color:#ff3b30;font-size:10px;">📕 '+loc.xhs+'</span>';
  h+='</div>';return h;
}

function showDay(di){
  currentDay=di;clearMap();
  document.querySelectorAll('.day-tab').forEach((t,i)=>t.classList.toggle('active',i===di));
  const plan=PLAN;
  if(di===0){renderOverview(plan);
    plan.days.forEach(d=>d.locations.forEach(l=>{if(l.lng)addMarker(l,d.color);}));
    if(markers.length&&map)map.setFitView(markers);
  }else{
    const day=plan.days[di-1];if(!day)return;
    renderLocList(day,plan);
    const coords=[];
    day.locations.forEach(l=>{if(l.lng){addMarker(l,day.color);coords.push([l.lng,loc.lat]);}});
    if(coords.length>1){
      const lineStyle = day.transport==='hsr'?'solid':'dashed';
      addPolyline(coords,day.color,lineStyle);
    }
    if(markers.length&&map)map.setFitView(markers,false,[40,40,40,40]);
  }
}

function renderUI(){
  const dt=document.getElementById('day-tabs');
  let h='<div class="day-tab active" onclick="showDay(0)">总览</div>';
  PLAN.days.forEach((d,i)=>{h+=`<div class="day-tab" onclick="showDay(${i+1})">${d.label}</div>`;});
  dt.innerHTML=h;
  document.getElementById('sheet-handle').addEventListener('click',()=>document.getElementById('sheet').classList.toggle('expanded'));
}

function renderLocList(day,plan){
  const el=document.getElementById('content');
  let h='';
  if(day.transport==='hsr')h+='<div style="background:rgba(52,199,89,.08);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:12px;">🚄 高铁日 · 无需驾车</div>';
  else if(day.transport==='charter')h+='<div style="background:rgba(0,122,255,.08);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:12px;">🚐 包车日 · 当地包车</div>';
  else if(day.drives&&day.drives.length>0){
    const td=day.drives.reduce((s,dr)=>s+parseT(dr.time),0);
    const dd=day.drives.reduce((s,dr)=>s+parseFloat(dr.dist),0);
    const tl=day.drives.reduce((s,dr)=>s+parseInt((dr.toll||'¥0').replace(/[^0-9]/g,'')||0),0);
    h+='<div style="background:var(--bg-grouped);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:12px;">🚗 今日驾车: '+Math.floor(td/60)+'h'+td%60+'m · '+dd.toFixed(0)+'km · 过路费¥'+tl+'</div>';
  }
  day.locations.forEach((l,i)=>{
    const c=COLORS[l.type]||'#0071e3',e=EMOJIS[l.type]||'📌';
    h+='<div class="loc-card" onclick="focusLoc('+i+')">';
    h+='<div class="loc-icon" style="background:'+c+'20;color:'+c+'">'+e+'</div>';
    h+='<div class="loc-info">';
    h+='<div class="loc-name">'+l.name+'</div>';
    if(l.time)h+='<div class="loc-meta">⏰ '+l.time+'</div>';
    if(l.desc)h+='<div class="loc-desc">'+l.desc+'</div>';
    if(l.budget)h+='<div class="loc-desc" style="color:var(--tint-orange)">💰 '+l.budget+'</div>';
    if(l.reserve)h+='<div class="loc-desc" style="color:var(--tint-red)">📅 '+l.reserve+'</div>';
    if(l.xhs)h+='<div class="xhs-ref">📕 '+l.xhs+'</div>';
    h+='</div></div>';
    if(day.drives&&day.drives[i]){
      const dr=day.drives[i];
      h+='<div class="loc-drive">🚗 '+dr.name+': '+dr.time+' · '+dr.dist+(dr.toll?' · '+dr.toll:'')+'</div>';
    }
    if(day.transits&&day.transits[i]){
      const tr=day.transits[i];
      const cls = tr.type==='hsr'?'loc-hsr':(tr.type==='taxi'?'loc-taxi':'loc-drive');
      const icon = tr.type==='hsr'?'🚄':(tr.type==='taxi'?'🚕':'🚐');
      h+='<div class="'+cls+'">'+icon+' '+tr.name+': '+tr.time+(tr.cost?' · '+tr.cost:'')+'</div>';
    }
  });
  el.innerHTML=h;
}

function focusLoc(idx){
  const day=PLAN.days[currentDay-1];
  if(!day||!map)return;const loc=day.locations[idx];
  if(!loc||!loc.lng)return;
  map.setZoomAndCenter(15,[loc.lng,loc.lat]);
}

window.showDay=showDay;window.focusLoc=focusLoc;

function renderOverview(plan){
  const el=document.getElementById('content');
  let h='<div class="ov-title">'+plan.icon+' '+plan.name+'</div>';
  h+='<div class="ov-text">'+plan.desc+'</div>';
  h+='<div class="sec-head">方案数据</div>';
  h+='<div style="font-size:13px;line-height:2;">';
  h+='<span class="badge info">'+plan.stat+'</span><br>';
  h+='<span class="badge ok">人均费用</span> '+plan.cost_per_person+'<br>';
  h+='<span class="badge info">交通方式</span> '+plan.transport;
  h+='</div>';
  h+='<div class="sec-head">每日概览</div>';
  plan.days.forEach(d=>{
    const td=(d.drives||[]).reduce((s,dr)=>s+parseT(dr.time),0);
    const tt=(d.transits||[]).reduce((s,tr)=>s+parseT(tr.time),0);
    const total=td+tt;
    if(d.transport==='hsr')h+='<div style="font-size:13px;margin:4px 0;"><b>Day '+d.day+'</b> '+d.area+' <span class="badge ok">🚄 高铁</span></div>';
    else if(d.transport==='charter')h+='<div style="font-size:13px;margin:4px 0;"><b>Day '+d.day+'</b> '+d.area+' <span class="badge info">🚐 包车</span></div>';
    else if(total>0)h+='<div style="font-size:13px;margin:4px 0;"><b>Day '+d.day+'</b> '+d.area+' <span class="badge info">驾'+Math.floor(total/60)+'h'+total%60+'m</span></div>';
    else h+='<div style="font-size:13px;margin:4px 0;"><b>Day '+d.day+'</b> '+d.area+' <span class="badge ok">休整</span></div>';
  });
  h+='<div class="sec-head">其他方案</div>';
  h+='<div style="display:flex;flex-wrap:wrap;">';
  ALL_NAMES.forEach(n=>{
    if(n.id!==plan.id){
      // ⚠ 事件隔离：链接在可点击卡片内时必须 stopPropagation
      h+='<a href="plan-'+n.id.toLowerCase()+'.html" class="nav-link" style="background:'+n.color+'">'+n.icon+' '+n.name+'</a>';
    }
  });
  h+='<a href="overview.html" class="nav-link back">📊 四版总对比</a>';
  h+='</div>';
  el.innerHTML=h;
}

initMap([126.5,42.0],6);
window.renderOverview=renderOverview;
</script>
</body></html>
